  <script>
    document.documentElement.classList.add('lb-js');
    window.addEventListener('DOMContentLoaded', () => {
      requestAnimationFrame(() => document.body.classList.add('lb-ready'));
    });

    const frame = document.getElementById('lb-site-frame');
    const resizeFrame = () => {
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        const height = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
        if (height > 0) frame.style.height = height + 'px';
      } catch (_) {}
    };

    frame.addEventListener('load', () => {
      resizeFrame();
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        if ('ResizeObserver' in window) {
          const observer = new ResizeObserver(resizeFrame);
          observer.observe(doc.documentElement);
          observer.observe(doc.body);
        }
        setTimeout(resizeFrame, 300);
        setTimeout(resizeFrame, 1200);
        setTimeout(resizeFrame, 3000);
      } catch (_) {}
    });
  </script>
