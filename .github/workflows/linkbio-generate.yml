name: Generate Link Bio

on:
  push:
    branches:
      - linkbio-v2
      - 'codex/linkbio-*'
      - client-preview
    paths:
      - 'index.html'
      - 'linkbio/index.html'
      - 'linkbio/template.html'
      - 'linkbio/experience.html'
      - 'client-preview.html'
      - 'scripts/generate-linkbio.mjs'
      - 'scripts/check-linkbio-parity.mjs'
      - 'scripts/check-linkbio-assets.mjs'
      - 'scripts/check-linkbio-typography.mjs'
      - 'scripts/check-linkbio-interactions.mjs'
      - 'scripts/check-linkbio-brand-position.mjs'
      - 'scripts/check-linkbio-brand-loop.mjs'
      - 'scripts/check-linkbio-color-sequence.mjs'
      - 'scripts/check-linkbio-category-card-links.mjs'
      - 'scripts/check-linkbio-equipment-cards.mjs'
      - 'scripts/check-linkbio-sticky-header.mjs'
      - 'scripts/check-linkbio-committed-preview.mjs'
      - 'scripts/check-client-preview.mjs'
      - 'assets/css/linkbio.css'
      - 'assets/css/linkbio-experience.css'
      - 'assets/css/linkbio-fonts.css'
      - 'assets/css/linkbio-color-sequence.css'
      - 'assets/css/linkbio-interactions.css'
      - 'assets/js/linkbio.js'
      - 'assets/js/linkbio-experience.js'
      - '.github/workflows/linkbio-generate.yml'

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[skip linkbio-generate]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate native Link Bio
        run: node scripts/generate-linkbio.mjs

      - name: Run source guards
        run: |
          node scripts/check-linkbio-parity.mjs
          node scripts/check-linkbio-assets.mjs
          node scripts/check-linkbio-typography.mjs
          node scripts/check-linkbio-interactions.mjs
          node scripts/check-linkbio-brand-position.mjs
          node scripts/check-linkbio-brand-loop.mjs
          node scripts/check-linkbio-color-sequence.mjs
          node scripts/check-linkbio-category-card-links.mjs
          node scripts/check-linkbio-equipment-cards.mjs
          node scripts/check-linkbio-sticky-header.mjs
          node scripts/check-client-preview.mjs
          node --check assets/js/linkbio.js
          if [ -f assets/js/linkbio-experience.js ]; then node --check assets/js/linkbio-experience.js; fi
          git diff --check

      - name: Prepare generated output commit when needed
        id: generated
        if: ${{ github.event_name == 'push' && (github.ref_name == 'linkbio-v2' || startsWith(github.ref_name, 'codex/linkbio-')) }}
        shell: bash
        run: |
          if git diff --quiet -- linkbio/index.html; then
            echo "linkbio/index.html already current"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linkbio/index.html
          git commit -m "build(linkbio): atualiza pagina nativa [skip linkbio-generate]"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Validate committed preview
        run: node scripts/check-linkbio-committed-preview.mjs

      - name: Push generated output when needed
        if: ${{ steps.generated.outputs.changed == 'true' }}
        shell: bash
        run: git push origin HEAD:${GITHUB_REF_NAME}
