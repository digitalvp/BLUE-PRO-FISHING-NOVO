<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Blue Pro Fishing | Links</title>
  <meta name="description" content="Experiência Blue Pro Fishing em Palmas - TO.">
  <link rel="canonical" href="/links/">
  <meta name="theme-color" content="#031b3d">
  <style>html,body{margin:0;min-height:100%;background:#031b3d}body{visibility:hidden}</style>
</head>
<body>
  <script>
  (async()=>{
    try{
      const response=await fetch('./source.html',{cache:'no-store'});
      if(!response.ok) throw new Error('Falha ao carregar LinkBio2: '+response.status);
      let html=await response.text();
      const facadeBase='https://raw.githubusercontent.com/digitalvp/BLUE-PRO-FISHING-NOVO/codex/linkbio-equipment-cards-premium/assets/img/linkbio/';
      html=html
        .replaceAll('/assets/img/linkbio/fachada-blue-pro-480.webp','__FACADE_480__')
        .replaceAll('/assets/img/linkbio/fachada-blue-pro-768.webp','__FACADE_768__')
        .replaceAll('/assets/img/linkbio/fachada-blue-pro-1024.webp','__FACADE_1024__')
        .replaceAll('/assets/','/links/assets/')
        .replaceAll('/linkbio/','/links/')
        .replaceAll('__FACADE_480__',facadeBase+'fachada-blue-pro-480.webp')
        .replaceAll('__FACADE_768__',facadeBase+'fachada-blue-pro-768.webp')
        .replaceAll('__FACADE_1024__',facadeBase+'fachada-blue-pro-1024.webp');
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      document.body.style.visibility='visible';
      document.body.innerHTML='<main style="font-family:Arial,sans-serif;color:#fff;padding:40px;max-width:760px;margin:auto"><h1>Blue Pro Fishing</h1><p>Não foi possível carregar esta visualização agora.</p></main>';
      console.error(error);
    }
  })();
  </script>
</body>
</html>
